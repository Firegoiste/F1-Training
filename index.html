
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>F1 Telemetry Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #15151E;
        color: #FFFFFF;
        /* Updated Fonts: Titillium Web for English/Numbers, Microsoft YaHei for Chinese */
        font-family: "Titillium Web", "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Make inputs match the font */
      input, textarea, button {
        font-family: inherit;
      }

      /* Custom Scrollbar for the dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #15151E; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      
      .skew-f1 {
        transform: skewX(-12deg);
      }
      .unskew-f1 {
        transform: skewX(12deg);
      }

      /* Apple-like smooth spring transition */
      .ease-spring {
        transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Range Slider Styling for ERS */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 24px;
        width: 12px;
        background: #E10600;
        cursor: pointer;
        margin-top: -8px;
        border: 2px solid white;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: #333;
        border-radius: 0px;
        border: 1px solid #555;
      }
      
      /* Animations */
      @keyframes radio-slide {
        0% { transform: translateY(100%); opacity: 0; }
        10% { transform: translateY(0); opacity: 1; }
        90% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(100%); opacity: 0; }
      }
      .animate-radio {
        animation: radio-slide 3s forwards ease-in-out;
      }

      @keyframes scale-in {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-scale-in {
        animation: scale-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
